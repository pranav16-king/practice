<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Heavy Metal Pollution Indices</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col text-white font-[Montserrat] relative overflow-hidden">
  <!-- Background video -->
  <video autoplay muted loop playsinline
         class="absolute inset-0 w-full h-full object-cover z-[-1]">
    <source src="/static/Image/second.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Transparent Header -->
  <header class="fixed w-full top-0 left-0 z-50 bg-white/5 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center px-4 py-3 md:px-6 md:py-4">
      <h1 class="text-base md:text-xl font-bold">⚗️ Heavy Metal Pollution Indices</h1>
      <nav class="flex gap-4 md:gap-6 mt-2 md:mt-0">
        <a href="/" class="hover:text-sky-300 text-sm md:text-base">Home</a>
        <a href="/signin" class="hover:text-sky-300 text-sm md:text-base">Register</a>
      </nav>
    </div>
  </header>

  <!-- Login Form -->
  <main class="flex-1 flex justify-center items-center px-3 md:px-4 pt-24 md:pt-28">
    <div class="bg-white/10 backdrop-blur-md rounded-xl shadow-lg p-4 md:p-8 w-full max-w-sm md:max-w-md border border-white/20">
      <h2 class="text-xl md:text-2xl font-bold text-center mb-4 md:mb-6">Welcome Back</h2>

      <form action="/submit" method="POST" class="space-y-3 md:space-y-4">
        <div>
          <label class="block mb-1 text-xs md:text-sm font-semibold">Email</label>
          <input type="email" name="email" required
            class="w-full px-3 md:px-4 py-2 rounded-lg bg-white/20 border border-white/30 focus:ring-2 focus:ring-sky-400 outline-none text-sm md:text-base">
        </div>

        <div>
          <label class="block mb-1 text-xs md:text-sm font-semibold">Password</label>
          <input type="password" name="password" required
            class="w-full px-3 md:px-4 py-2 rounded-lg bg-white/20 border border-white/30 focus:ring-2 focus:ring-sky-400 outline-none text-sm md:text-base">
        </div>

        <a href="/home/main.html"
  class="w-full py-2 mt-2 md:mt-4 rounded-lg bg-gradient-to-r from-sky-500 to-blue-600 hover:scale-105 transition font-semibold text-center text-white text-sm md:text-base block text-center">
  Login
</a>
      </form>

      <p class="text-center text-xs md:text-sm mt-3 md:mt-4">
        Don’t have an account?
        <a href="/signin" class="text-sky-300 hover:underline">Register</a>
      </p>
    </div>
  </main>
</body>
</html>
