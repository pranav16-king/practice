<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LunaBot Mission Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/main/style.css">
  <style>
    /* Animated Background */
    main {
 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: lunar-pan 40s ease-in-out infinite alternate;
    }

    @keyframes lunar-pan {
      0% {
        background-size: 100%;
        background-position: center;
      }

      50% {
        background-size: 115%;
        background-position: top center;
      }

      100% {
        background-size: 100%;
        background-position: center;
      }
    }

    /* Card animation */
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Counter animation */
    .counter {
      font-size: 2rem;
      font-weight: bold;
      color: #66fcf1;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }
  </style>
</head>

<body class="flex bg-gray-900 text-gray-100 min-h-screen">

  <!-- Sidebar -->
  <header id="sidebar" class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-700 text-cyan-400 w-60 min-h-screen fixed flex flex-col items-center p-6 shadow-lg transition-all duration-300">
    <button id="toggleSidebar" class="toggle-btn text-4xl mb-6 cursor-pointer">☰</button>
    <h1 class="text-xl font-bold mb-8 text-center transition-all duration-300 header-title">🌙 LunaBot Admin</h1>
    <div class="flex flex-col space-y-2 w-full px-2">
      <a href="/admin_home" class="nav-link flex items-center gap-3 px-3 py-2 rounded hover:bg-cyan-500/20 transition">
        <span class="emoji">🏠</span><span class="label">Home</span>
      </a>
      <a href="/navigation_status" class="nav-link flex items-center gap-3 px-3 py-2 rounded hover:bg-cyan-500/20 transition">
        <span class="emoji">🤖</span><span class="label">Navigation</span>
      </a>
      <a href="/mapping" class="nav-link flex items-center gap-3 px-3 py-2 rounded hover:bg-cyan-500/20 transition">
        <span class="emoji">🗺️</span><span class="label">Mapping</span>
      </a>
      <a href="/maintenance" class="nav-link flex items-center gap-3 px-3 py-2 rounded hover:bg-cyan-500/20 transition">
        <span class="emoji">🔧</span><span class="label">Maintenance</span>
      </a>
      <a href="/alerts" class="nav-link flex items-center gap-3 px-3 py-2 rounded hover:bg-cyan-500/20 transition">
        <span class="emoji">⚠️</span><span class="label">Alerts</span>
      </a>
      <a href="{{ url_for('setting') }}" class="nav-link flex items-center gap-3 px-3 py-2 rounded hover:bg-cyan-500/20 transition">
        <span class="emoji">⚙️</span><span class="label">Settings</span>
      </a>
    </div>

    <div class="profile mt-auto w-full flex items-center p-3 rounded-lg bg-gray-800/50 hover:scale-105 transition">
      <img src="/static/images_index/profile_avatar.png" alt="Profile" class="w-12 h-12 rounded-full border-2 border-cyan-400 mr-3">
      <div class="flex flex-col">
        <span class="text-sm font-semibold">Welcome, {{name}}</span>
        <a href="/logout">
          <button class="bg-cyan-700 text-white text-sm px-3 py-1 rounded mt-1 hover:bg-cyan-800 transition">Logout</button>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainContent" class="flex-1 ml-60 p-6 min-h-screen">

 
  </main>

  <script src="/main/script.js"></script>
</body>

</html>
<script>
  const toggleBtn = document.getElementById('toggleSidebar');
const sidebar = document.getElementById('sidebar');
const mainContent = document.getElementById('mainContent');

toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    if (sidebar.classList.contains('collapsed')) {
        mainContent.classList.remove('ml-[240px]');
        mainContent.classList.add('ml-[72px]');
    } else {
        mainContent.classList.remove('ml-[72px]');
        mainContent.classList.add('ml-[240px]');
    }
});

</script>
