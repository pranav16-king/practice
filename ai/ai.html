<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Chat Bot</title>
    <link rel="stylesheet" href="/static/ai.css">
</head>

<body style="background-image: url('/static/Image/space.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div class="chat-container">
        <div class="ai-chat-box">
            <img src="/static/AI_images/AI.png" alt="" id="aiImage" width="120px">
            <div class="ai-chat-area">
                Hello ! How Can I Help you Today?
            </div>

        </div>
    </div>
    <div class="prompt-area">
        <input type="text" id="prompt" placeholder="Message...">
        <button id="image"><img src="/static/AI_images/img.svg" alt="image unavialabe">
            <input type="file" accept="images/*" hidden></button>
        <button id="submit"><img src="/static/AI_images/submit.svg" alt="image unavailable"></button>
    </div>
    <script src="/static/ai.js"></script>
</body>

</html>
